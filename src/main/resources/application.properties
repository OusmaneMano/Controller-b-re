# CONTROLLER Backend Configuration - PostgreSQL + Environment Variables

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=${PORT:8080}
server.servlet.context-path=/api

# ============================================
# DATABASE CONFIGURATION - PostgreSQL
# ============================================
# NOTE: Render's PostgreSQL gives you a "postgres://" style connection string,
# NOT a JDBC one. Build DATABASE_URL yourself from the host/port/db name shown
# in Render's Postgres dashboard, in the form below (sslmode=require is required
# on Render). See the deployment notes for details.
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================
# No explicit dialect set: Hibernate 6.x (bundled with Spring Boot 3.2.x)
# auto-detects the correct PostgreSQL dialect from the JDBC connection.
# Old dialect classes like PostgreSQL10Dialect no longer exist in Hibernate 6.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# ============================================
# JWT CONFIGURATION
# ============================================
app.jwt.secret=${JWT_SECRET:GenerateAStrongSecretKeyWithAtLeast256BitsForProduction}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ============================================
# GOOGLE OAUTH CONFIGURATION
# ============================================
google.oauth.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}

# ============================================
# APPLICATION CONFIGURATION
# ============================================
spring.application.name=CONTROLLER-API
app.name=CONTROLLER
app.version=1.0.0
app.admin.email=${ADMIN_EMAIL:ousmanemanot@gmail.com}
app.admin.phone=${ADMIN_PHONE:+491777967944}

# ============================================
# MAIL CONFIGURATION
# ============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:/tmp/controller-uploads}

# ============================================
# JACKSON CONFIGURATION
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.com.controller=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# CORS CONFIGURATION
# ============================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# ============================================
# RENDER DEPLOYMENT CONFIGURATION
# ============================================
# For Render, connections should use SSL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Single source of truth for the JDBC URL (local default includes sslmode=require
# too, which Postgres ignores harmlessly when running without SSL locally on most setups;
# if it ever complains locally, just drop the query param in your local override).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/controller_db?sslmode=require}
